# Sample inputs.conf for the Splunk Universal Forwarder
# Location on the Windows host:
#   C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
#
# Tells the forwarder which event logs to ship and which Splunk index to
# send them to. If the "endpoint" index doesn't exist on the Splunk server,
# none of this data will be received on the other end.
#
# Replace values as needed for your own environment. Don't commit real
# credentials or internal hostnames if this repo is public.

[WinEventLog://Application]
disabled = 0
index = endpoint

[WinEventLog://Security]
disabled = 0
index = endpoint

[WinEventLog://System]
disabled = 0
index = endpoint

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = endpoint
renderXml = 1
source = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
